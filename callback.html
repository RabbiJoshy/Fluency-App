<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Spotify Auth</title></head>
<body>
<p>Connecting to Spotify…</p>
<script>
(async function() {
    const APP_STARTED = 'spotify_app_auth_started';
    const APP_BROKEN = 'spotify_app_login_broken';
    const APP_FINISHING = 'spotify_app_auth_finishing';
    const APP_HANDOFF = 'spotify_app_auth_handoff';

    function clearAppAttempt() {
        localStorage.removeItem(APP_STARTED);
        localStorage.removeItem(APP_FINISHING);
        localStorage.removeItem(APP_HANDOFF);
    }

    function readReturnUrl(stateValue) {
        try {
            return JSON.parse(atob(stateValue)).returnUrl || './';
        } catch (e) {
            return './';
        }
    }

    function withWebLogin(returnUrl) {
        try {
            const url = new URL(returnUrl, window.location.href);
            url.searchParams.set('spotifyWebLogin', '1');
            return url.href;
        } catch (e) {
            return './?spotifyWebLogin=1';
        }
    }

    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const error = params.get('error');
    const stateB64Early = params.get('state');

    if (error || !code) {
        const message = 'Spotify auth error: ' + (error || 'no code received');
        document.body.textContent = message + '. Full URL: ' + window.location.href;
        console.error('Spotify callback error:', error, 'Full params:', window.location.search);
        // Surface the real reason in the opener's console too — the popup
        // usually closes/gets replaced before anyone reads this page, so
        // "Login failed or cancelled" was the only thing visible before.
        if (window.opener) {
            window.opener.postMessage({ type: 'spotify-auth-error', error: message }, window.location.origin);
        } else if (localStorage.getItem(APP_STARTED)) {
            const returnUrl = readReturnUrl(stateB64Early);
            clearAppAttempt();
            // Cancel keeps the app link. Anything else is a failed return,
            // so the next Connect uses the website, and this return starts it.
            if (error !== 'access_denied') {
                localStorage.setItem(APP_BROKEN, '1');
                window.location.href = withWebLogin(returnUrl);
                return;
            }
            window.location.href = returnUrl;
        }
        return;
    }

    // Auth state is passed via the Spotify `state` param (avoids cross-origin sessionStorage issues)
    const stateB64 = params.get('state');
    let codeVerifier, clientId, redirectUri, stateObj;
    try {
        stateObj = JSON.parse(atob(stateB64));
        codeVerifier = stateObj.verifier;
        clientId = stateObj.clientId;
        redirectUri = stateObj.redirectUri;
    } catch (e) {
        // Fallback to sessionStorage for backwards compat
        codeVerifier = sessionStorage.getItem('spotify_code_verifier');
        clientId = sessionStorage.getItem('spotify_client_id');
        redirectUri = sessionStorage.getItem('spotify_redirect_uri');
    }

    if (!codeVerifier || !clientId) {
        document.body.textContent = 'Missing auth state. Please try again.';
        setTimeout(() => { window.location.href = './'; }, 2000);
        return;
    }

    try {
        if (!window.opener && localStorage.getItem(APP_STARTED)) {
            localStorage.setItem(APP_FINISHING, '1');
            localStorage.removeItem(APP_STARTED);
        }

        const resp = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                grant_type: 'authorization_code',
                code,
                redirect_uri: redirectUri,
                client_id: clientId,
                code_verifier: codeVerifier
            })
        });

        const data = await resp.json();
        if (!resp.ok) throw new Error(data.error_description || data.error || 'Token exchange failed');

        const tokens = {
            access_token: data.access_token,
            refresh_token: data.refresh_token,
            token_expiry: String(Date.now() + data.expires_in * 1000)
        };

        // Store tokens
        localStorage.setItem('spotify_access_token', tokens.access_token);
        localStorage.setItem('spotify_refresh_token', tokens.refresh_token);
        localStorage.setItem('spotify_token_expiry', tokens.token_expiry);
        localStorage.removeItem(APP_BROKEN);
        clearAppAttempt();

        sessionStorage.removeItem('spotify_code_verifier');
        sessionStorage.removeItem('spotify_client_id');
        sessionStorage.removeItem('spotify_redirect_uri');
        sessionStorage.removeItem('spotify_return_url');

        if (window.opener) {
            // Desktop popup flow: send tokens to opener and close
            // Tokens go only to a page on this origin; the app never opens this
            // callback from anywhere else.
            window.opener.postMessage({ type: 'spotify-auth', tokens }, window.location.origin);
            document.body.textContent = 'Spotify connected! This window will close.';
            window.close();
        } else {
            // Mobile redirect flow: navigate back to the app
            // returnUrl was encoded in the state param by spotifyLogin()
            const returnUrl = (stateObj && stateObj.returnUrl) || './';
            document.body.textContent = 'Spotify connected! Returning to app...';
            window.location.href = returnUrl;
        }
    } catch (err) {
        document.body.textContent = 'Auth failed: ' + err.message;
        console.error('Spotify token exchange error:', err);
        if (window.opener) {
            window.opener.postMessage({ type: 'spotify-auth-error', error: 'Token exchange failed: ' + err.message }, window.location.origin);
        } else {
            const returnUrl = (stateObj && stateObj.returnUrl) || './';
            localStorage.setItem(APP_BROKEN, '1');
            clearAppAttempt();
            window.location.href = withWebLogin(returnUrl);
        }
    }
})();
</script>
</body>
</html>
